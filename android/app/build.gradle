plugins {
    id 'com.android.application'
}

def sdlDir = System.getenv('SDL2_DIR') ?: project.property('sdl2.dir')

android {
    namespace 'com.exhilo.goldensundualscreen'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'com.exhilo.goldensundualscreen'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '0.1.0-beta'
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static", "-DSDL2_DIR=${sdlDir}"
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }
    sourceSets.main.java.srcDirs += ["${sdlDir}/android-project/app/src/main/java"]
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    lint {
        abortOnError false
    }
}
